name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest tests/python/test_wire_request_digest.py
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: shellcheck scripts/run-worker scripts/run-shadow scripts/run-active
